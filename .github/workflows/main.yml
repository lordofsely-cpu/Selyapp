name: Build Sely APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Sely Android APK
    runs-on: ubuntu-latest

    steps:

      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Android SDK cmdline-tools manually
      #    (android-actions/setup-android@v3 tries to install a
      #    legacy "tools" package that no longer exists in the SDK
      #    repository, so we set it up by hand instead.)
      - name: Set up Android SDK
        shell: bash
        run: |
          set -e
          ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          curl -sSL -o cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      # 4. Install required Android SDK components
      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      # 5. Find and extract Sely project if it is stored as a ZIP
      - name: Prepare Sely project
        shell: bash
        run: |
          set -e

          echo "Files in repository:"
          find . -maxdepth 3 -type f | sort

          if [ -f "settings.gradle" ] && [ -d "app" ]; then
            echo "Android project already exists at repository root."
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"

          else
            ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No Android project or ZIP file was found."
              exit 1
            fi

            echo "Found ZIP: $ZIP_FILE"

            mkdir -p project
            unzip -o "$ZIP_FILE" -d project

            echo "Extracted files:"
            find project -maxdepth 4 -type f | sort

            # Find the directory containing settings.gradle
            PROJECT_SETTINGS=$(find project -name "settings.gradle" -type f | head -n 1)

            if [ -z "$PROJECT_SETTINGS" ]; then
              echo "ERROR: settings.gradle was not found after extraction."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$PROJECT_SETTINGS")

            echo "Android project directory: $PROJECT_DIR"
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          fi

      # 6. Enable AndroidX
      - name: Configure AndroidX
        run: |
          cd "$PROJECT_DIR"

          touch gradle.properties

          grep -q "^android.useAndroidX=true" gradle.properties \
            || echo "android.useAndroidX=true" >> gradle.properties

          grep -q "^android.enableJetifier=true" gradle.properties \
            || echo "android.enableJetifier=true" >> gradle.properties

          echo "gradle.properties:"
          cat gradle.properties

      # 7. Install Gradle 8.2
      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      # 8. Check project
      - name: Verify Android project
        run: |
          cd "$PROJECT_DIR"

          echo "Gradle version:"
          gradle --version

          echo "Project files:"
          ls -la

          echo "App files:"
          ls -la app

      # 9. Build APK
      - name: Build Sely Debug APK
        run: |
          cd "$PROJECT_DIR"

          gradle :app:assembleDebug --stacktrace

      # 10. Find generated APK
      - name: Check APK
        run: |
          echo "Searching for APK..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          if [ ! -f "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          ls -lh "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

      # 11. Upload APK to GitHub Actions
      - name: Upload Sely APK
        uses: actions/upload-artifact@v4
        with:
          name: Sely-App-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 12. Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sely-build-${{ github.run_number }}
          name: Sely APK Build ${{ github.run_number }}
          files: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
